<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecureCam — WebRTC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080b10;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px;
    border-bottom: 1px solid #202631;
    background: #0d1118;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 7px 0 0;
    color: #7f8b9d;
}

.container {
    width: min(1100px, 94%);
    margin: 25px auto;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.card {
    background: #0d121a;
    border: 1px solid #202936;
    border-radius: 15px;
    padding: 18px;
}

.card h2 {
    margin-top: 0;
}

video {
    width: 100%;
    background: #020304;
    border-radius: 12px;
    min-height: 220px;
    object-fit: cover;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.15);
}

button.danger {
    background: #b91c1c;
}

textarea {
    width: 100%;
    min-height: 150px;
    margin-top: 10px;
    resize: vertical;
    background: #070a0f;
    color: #dce5f0;
    border: 1px solid #283241;
    border-radius: 9px;
    padding: 12px;
    font-family: monospace;
}

.status {
    padding: 11px;
    border-radius: 8px;
    margin-top: 12px;
    background: #111823;
    color: #9ba8ba;
}

.online {
    color: #4ade80;
}

.warning {
    margin-top: 20px;
    padding: 13px;
    border-radius: 9px;
    background: #17130a;
    border: 1px solid #51400e;
    color: #e7cf72;
}

@media(max-width: 750px) {
    .grid {
        grid-template-columns: 1fr;
    }

    header {
        padding: 17px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SecureCam</h1>
    <p>WebRTC камера и микрофон с разрешением пользователя</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
    <h2>📷 Передающая сторона</h2>

    <video id="localVideo" autoplay muted playsinline></video>

    <button onclick="startCamera()">
        Разрешить камеру и микрофон
    </button>

    <button onclick="createOffer()">
        Создать подключение
    </button>

    <button class="danger" onclick="stopCamera()">
        Остановить камеру и микрофон
    </button>

    <div id="localStatus" class="status">
        Статус: отключено
    </div>

    <textarea
        id="offer"
        placeholder="Здесь появится Offer. Скопируй его на принимающее устройство."
    ></textarea>
</div>


<div class="card">
    <h2>🖥️ Принимающая сторона</h2>

    <video id="remoteVideo" autoplay playsinline controls></video>

    <textarea
        id="offerInput"
        placeholder="Вставь сюда Offer с первого устройства"
    ></textarea>

    <button onclick="createAnswer()">
        Принять подключение
    </button>

    <textarea
        id="answer"
        placeholder="Здесь появится Answer. Верни его на первое устройство."
    ></textarea>

    <button onclick="finishConnection()">
        Завершить подключение
    </button>

    <div id="remoteStatus" class="status">
        Статус: ожидание
    </div>
</div>

</div>

<div class="warning">
    🔒 Камера и микрофон работают только после явного разрешения браузера.
    Страница не получает доступ к файлам, паролям или терминалу устройства.
</div>

</div>


<script>

let localStream = null;

let senderPC = null;
let receiverPC = null;


/* ---------------------------
   КАМЕРА + МИКРОФОН
---------------------------- */

async function startCamera() {

    try {

        localStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: true
        });

        document.getElementById("localVideo").srcObject =
            localStream;

        document.getElementById("localStatus").innerHTML =
            '<span class="online">● Камера и микрофон разрешены</span>';

    } catch (error) {

        document.getElementById("localStatus").textContent =
            "Ошибка: " + error.message;

    }
}


/* ---------------------------
   ОСТАНОВКА
---------------------------- */

function stopCamera() {

    if (localStream) {

        localStream.getTracks().forEach(track => {
            track.stop();
        });

        localStream = null;
    }

    document.getElementById("localVideo").srcObject = null;

    if (senderPC) {
        senderPC.close();
        senderPC = null;
    }

    document.getElementById("localStatus").textContent =
        "Камера и микрофон остановлены";
}


/* ---------------------------
   СОЗДАНИЕ OFFER
---------------------------- */

async function createOffer() {

    if (!localStream) {
        alert("Сначала разреши камеру и микрофон.");
        return;
    }

    senderPC = new RTCPeerConnection({
        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            }
        ]
    });

    localStream.getTracks().forEach(track => {

        senderPC.addTrack(
            track,
            localStream
        );

    });

    senderPC.onconnectionstatechange = () => {

        document.getElementById("localStatus").textContent =
            "Соединение: " +
            senderPC.connectionState;
    };

    const offer =
        await senderPC.createOffer();

    await senderPC.setLocalDescription(offer);

    await waitForICE(senderPC);

    document.getElementById("offer").value =
        JSON.stringify(senderPC.localDescription);

}


/* ---------------------------
   СОЗДАНИЕ ANSWER
---------------------------- */

async function createAnswer() {

    const input =
        document.getElementById("offerInput").value.trim();

    if (!input) {
        alert("Вставь Offer.");
        return;
    }

    try {

        const offer =
            JSON.parse(input);

        receiverPC = new RTCPeerConnection({
            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                }
            ]
        });

        receiverPC.ontrack = event => {

            document.getElementById("remoteVideo").srcObject =
                event.streams[0];

        };

        receiverPC.onconnectionstatechange = () => {

            document.getElementById("remoteStatus").textContent =
                "Соединение: " +
                receiverPC.connectionState;

        };

        await receiverPC.setRemoteDescription(offer);

        const answer =
            await receiverPC.createAnswer();

        await receiverPC.setLocalDescription(answer);

        await waitForICE(receiverPC);

        document.getElementById("answer").value =
            JSON.stringify(receiverPC.localDescription);

    } catch (error) {

        alert(
            "Не удалось создать подключение: " +
            error.message
        );

    }
}


/* ---------------------------
   ЗАВЕРШЕНИЕ ПОДКЛЮЧЕНИЯ
---------------------------- */

async function finishConnection() {

    if (!senderPC) {
        alert("На первом устройстве сначала создай Offer.");
        return;
    }

    const input =
        document.getElementById("answer").value.trim();

    if (!input) {
        alert("Вставь Answer.");
        return;
    }

    try {

        const answer =
            JSON.parse(input);

        await senderPC.setRemoteDescription(answer);

        document.getElementById("localStatus").textContent =
            "Подключение устанавливается...";

    } catch (error) {

        alert(
            "Ошибка Answer: " +
            error.message
        );

    }
}


/* ---------------------------
   ОЖИДАНИЕ ICE
---------------------------- */

function waitForICE(pc) {

    return new Promise(resolve => {

        if (pc.iceGatheringState === "complete") {
            resolve();
            return;
        }

        function check() {

            if (pc.iceGatheringState === "complete") {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    check
                );

                resolve();
            }
        }

        pc.addEventListener(
            "icegatheringstatechange",
            check
        );

    });
}

</script>

</body>
</html>
